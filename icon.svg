<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- Firefox KDE theme: a globe in Firefox colors, drawn like a Breeze
       application icon (48px grid, 4px margins, light from above, 1px hard
       base shadow, 45° foreground shadow). Released into the public domain
       with the theme. -->
  <defs>
    <linearGradient id="base" x1="0" y1="4" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb34a"/>
      <stop offset="0.5" stop-color="#f67400"/>
      <stop offset="1" stop-color="#da4453"/>
    </linearGradient>
    <linearGradient id="shade" x1="14" y1="14" x2="38" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#000" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="4" x2="0" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="globe">
      <circle cx="24" cy="24" r="20"/>
    </clipPath>
  </defs>

  <!-- Base shadow: 1px hard shadow, black at 10% -->
  <circle cx="24" cy="25" r="20" fill="#000" fill-opacity="0.1"/>

  <!-- Base -->
  <circle cx="24" cy="24" r="20" fill="url(#base)"/>

  <g clip-path="url(#globe)">
    <!-- Foreground shadow: 45° to the bottom right, fading out -->
    <path d="M24 12 38 26 44 44H26L12 30Z" fill="url(#shade)" opacity="0.6"/>

    <!-- Foreground: meridians and parallels of the globe -->
    <g fill="none" stroke="#fff" stroke-opacity="0.55" stroke-width="2">
      <ellipse cx="24" cy="24" rx="9" ry="20"/>
      <path d="M24 4V44"/>
      <path d="M4 24H44"/>
      <path d="M8.5 13.5H39.5"/>
      <path d="M8.5 34.5H39.5"/>
    </g>

    <!-- Light from above -->
    <circle cx="24" cy="24" r="20" fill="url(#shine)"/>
  </g>

  <!-- Soft outline, 1px, darker at the bottom like Breeze icons -->
  <circle cx="24" cy="24" r="19.5" fill="none" stroke="#000" stroke-opacity="0.1"/>
</svg>
